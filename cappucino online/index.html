<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}


body{

background:#120803;
overflow:hidden;

}


/* LOADING */

.loader{

position:fixed;
top:0;
left:0;

width:100%;
height:100vh;

display:flex;
flex-direction:column;

justify-content:center;
align-items:center;

background:#120803;

z-index:9999;

animation:hideLoader .8s ease 3s forwards;

}


.loader img{

width:150px;
height:150px;

object-fit:contain;

animation:pulse 2s infinite;

}


.loader h2{

margin-top:20px;
color:#FFD700;
font-size:30px;

}


.loader p{

color:white;
margin-top:10px;

}


@keyframes pulse{

50%{
transform:scale(1.08);
}

}


@keyframes hideLoader{

to{
opacity:0;
visibility:hidden;
}

}



/* VIDEO BACKGROUND */


.bg-video{

position:fixed;

width:100%;
height:100%;

object-fit:cover;

z-index:-2;

filter:brightness(.35);

}



body:after{

content:"";

position:fixed;

width:100%;
height:100%;

background:
linear-gradient(
135deg,
rgba(20,8,3,.75),
rgba(111,78,55,.45)
);

z-index:-1;

}


/* WRAPPER */


.wrapper{

width:100%;
min-height:100vh;

display:flex;

justify-content:center;
align-items:center;

padding:25px;

}



/* CARD */


.container{

width:100%;
max-width:430px;

padding:35px;

border-radius:28px;

background:
rgba(255,255,255,.10);

backdrop-filter:blur(18px);

border:
1px solid rgba(255,255,255,.15);


box-shadow:
0 20px 60px rgba(0,0,0,.5);


color:white;

text-align:center;

animation:fadeUp .8s ease;

}



@keyframes fadeUp{

from{

opacity:0;
transform:translateY(30px);

}

to{

opacity:1;
transform:translateY(0);

}

}



.main-logo{

width:120px;
height:120px;

object-fit:contain;

filter:
drop-shadow(0 0 20px gold);

animation:logoFloat 3s infinite;

}



@keyframes logoFloat{

50%{

transform:translateY(-8px);

}

}



h1{

margin-top:20px;

font-size:34px;

font-weight:800;

color:#FFD700;

text-shadow:
0 0 15px gold;

}



.desc{

margin-top:10px;

line-height:1.6;

color:#eee;

}



.status{

display:flex;

justify-content:center;

gap:10px;

margin:25px 0;

flex-wrap:wrap;

}



.badge{

padding:8px 16px;

border-radius:50px;

background:
rgba(255,255,255,.12);

font-size:12px;

}



.btn{

display:flex;

justify-content:center;

align-items:center;

width:100%;

padding:16px;

margin:14px 0;

border-radius:16px;

font-size:17px;

font-weight:700;

text-decoration:none;

color:white;

transition:.3s;

}



.btn:hover{

transform:translateY(-4px);

}



.wa{

background:
linear-gradient(45deg,#0ea95d,#25D366);

}



.tg{

background:
linear-gradient(45deg,#0077b5,#00bfff);

}



.footer{

margin-top:25px;

font-size:12px;

color:#ddd;

}



/* FLOAT BUTTON */


.float-wa{

position:fixed;

right:20px;

bottom:20px;


width:60px;
height:60px;


border-radius:50%;


display:flex;

justify-content:center;

align-items:center;


background:#25D366;


color:white;


font-size:28px;


box-shadow:
0 0 20px #25D366;


animation:floatPulse 2s infinite;

}



@keyframes floatPulse{

50%{

transform:scale(1.1);

}

}


</style>
