<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}


body{

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:#120803;

}


/* VIDEO BACKGROUND */

.bg-video{

    position:fixed;

    right:0;
    bottom:0;

    min-width:100%;
    min-height:100%;

    object-fit:cover;

    z-index:-2;

    filter:brightness(35%);

}



/* OVERLAY */

body::after{

    content:"";

    position:fixed;

    width:100%;
    height:100%;

    background:

    linear-gradient(
    135deg,
    rgba(20,8,3,.8),
    rgba(139,90,43,.5)
    );

    z-index:-1;

}



/* CARD */

.container{

    width:90%;
    max-width:430px;

    padding:35px;

    background:

    rgba(255,255,255,.12);

    backdrop-filter:blur(20px);

    border-radius:30px;

    border:

    1px solid rgba(255,255,255,.25);

    text-align:center;

    color:white;

    box-shadow:

    0 20px 50px rgba(0,0,0,.6);

    animation:fade 1s ease;

}



@keyframes fade{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}



/* LOGO */

.logo{

font-size:75px;

animation:coffee 2s infinite;

}



@keyframes coffee{

50%{

transform:scale(1.08);

}

}



/* TITLE */


h1{

font-size:32px;

font-weight:800;

color:#FFD700;

text-shadow:

0 0 20px #FFD700;

margin:10px 0;

}



/* DESCRIPTION */


.desc{

font-size:15px;

color:#eee;

margin-bottom:20px;

}



/* STATUS */


.status{

display:flex;

justify-content:center;

gap:10px;

margin-bottom:20px;

}


.badge{

padding:8px 15px;

border-radius:30px;

background:

rgba(255,255,255,.15);

font-size:12px;

}



/* BUTTON */


.btn{

display:flex;

justify-content:center;

align-items:center;

gap:8px;

width:100%;

padding:16px;

margin:14px 0;

border-radius:18px;

text-decoration:none;

color:white;

font-size:17px;

font-weight:bold;

transition:.3s;

box-shadow:

0 10px 25px rgba(0,0,0,.4);

}



.btn:hover{

transform:translateY(-5px) scale(1.03);

}



/* WHATSAPP */

linear-gradient(
45deg,
#00a884,
#25D366
);

}



/* TELEGRAM */

#0077b5,

/* FLOATING WA */

right:25px;

bottom:25px;

width:60px;

height:60px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

background:#25D366;

font-size:30px;

text-decoration:none;

color:white;

box-shadow:

0 0 25px #25D366;

animation:ring 1.5s infinite;

}



@keyframes ring{

50%{

transform:scale(1.15);

}

}



/* FOOTER */


.footer{

margin-top:25px;

font-size:12px;

color:#ddd;

}


</style>
